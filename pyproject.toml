[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "patagoniaMet"
version = "0.1.0"

[tool.setuptools.packages.find]
include = ["patagoniaMet*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
